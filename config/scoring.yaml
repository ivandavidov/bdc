# Методология на скора „Качество“ (0–100). Всяка метрика има точки [стойност, подскор];
# между тях подскорът се интерполира линейно, извън тях се взема крайната стойност.
# Теглата са относителни в рамките на категорията и между категориите.

thresholds:
  green: 70     # >= 70 → зелено „Силна“
  yellow: 50    # 50–69 → жълто „Наблюдавай“; < 50 → червено „Слаба“
  incomplete: 0.7   # под 70% налично тегло → значка „Непълни данни“

categories:
  dividend:
    label: Дивидентна устойчивост
    weight: 25
    metrics:
      coverage_ttm:
        label: Покритие на дивидента с NII (12 м)
        weight: 60
        points: [[0.85, 0], [1.0, 60], [1.1, 100]]
      cuts_5y:
        label: Съкращения на дивидента (5 г.)
        weight: 25
        points: [[0, 100], [1, 65], [2, 35], [3, 0]]
      pik_pct_ttm:
        label: PIK доход (% от инвестиционния доход)
        weight: 15
        points: [[0.05, 100], [0.10, 60], [0.20, 0]]
  nav:
    label: Стабилност на NAV
    weight: 25
    metrics:
      nav_tr_3y:
        label: NAV обща доходност (3 г., годишно)
        weight: 50
        points: [[-0.02, 0], [0.04, 50], [0.08, 80], [0.11, 100]]
      nav_chg_3y:
        label: Промяна на NAV/акция (3 г.)
        weight: 30
        points: [[-0.20, 0], [-0.10, 40], [-0.03, 75], [0.0, 100]]
      nav_tr_1y:
        label: NAV обща доходност (1 г.)
        weight: 20
        points: [[-0.10, 0], [0.0, 40], [0.08, 85], [0.11, 100]]
  credit:
    label: Кредитно качество
    weight: 20
    metrics:
      nonaccrual_fv:
        label: Non-accruals (% от портфейла по справедлива стойност)
        weight: 45
        points: [[0.01, 100], [0.03, 60], [0.06, 0]]
      fv_cost:
        label: Справедлива стойност / цена на придобиване
        weight: 30
        points: [[0.90, 0], [0.95, 50], [0.99, 90], [1.01, 100]]
      first_lien:
        label: Дял първи залог
        weight: 15
        points: [[0.3, 0], [0.5, 40], [0.8, 90], [0.9, 100]]
      top10:
        label: Концентрация в топ 10 компании
        weight: 10
        points: [[0.15, 100], [0.25, 70], [0.40, 0]]
  leverage:
    label: Ливъридж
    weight: 15
    metrics:
      net_de:
        label: Нетен дълг / собствен капитал
        weight: 60
        points: [[0.9, 100], [1.1, 70], [1.25, 40], [1.4, 0]]
      asset_coverage:
        label: Asset coverage
        weight: 40
        points: [[1.5, 0], [1.7, 40], [1.9, 80], [2.1, 100]]
  costs:
    label: Разходи и управление
    weight: 15
    metrics:
      opex_ratio:
        label: Оперативни разходи без лихви (% от NAV)
        weight: 75
        points: [[0.025, 100], [0.045, 70], [0.065, 30], [0.085, 0]]
      internal:
        label: Вътрешно управление
        weight: 25
        points: [[0, 50], [1, 100]]

# Червени флагове: показват се винаги. 1–2 флага ограничават светофара до жълто,
# 3 или повече го правят червен, независимо от скора.
flags:
  coverage_below_90_2q: Покритие на дивидента под 90% две поредни тримесечия
  nonaccrual_high: Non-accruals над 5% от портфейла
  nav_drop: NAV/акция е спаднал с над 10% за година
  low_asset_coverage: Asset coverage под 170%
  cut_12m: Съкратен дивидент през последните 12 месеца
  suspended: Дивидентът е спрян

# Оценка спрямо собствената 3-годишна история на P/NAV (z-score).
valuation:
  cheap_z: -1.0
  expensive_z: 1.0
