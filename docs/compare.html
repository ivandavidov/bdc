<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сравнение на BDC</title>
  <meta name="description" content="Сравнение на до 4 Business Development Companies една до друга.">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
</head>
<body>
<main>
  <div class="page-head">
    <div>
      <h1>Сравнение</h1>
      <p>Изберете до 4 BDC. Таблицата показва показателите една до друга, а графиките наслагват историята им.</p>
    </div>
  </div>
  <div class="toolbar">
    <input type="text" id="picker" list="tickers" placeholder="Добави тикер, напр. ARCC" aria-label="Добави BDC">
    <datalist id="tickers"></datalist>
    <button class="btn" id="add" type="button">Добави</button>
    <span id="chosen" class="toolbar" style="margin:0"></span>
  </div>
  <div id="content"><div class="loading">Зареждане…</div></div>
</main>
<script type="module" src="assets/js/page-compare.js"></script>
</body>
</html>
